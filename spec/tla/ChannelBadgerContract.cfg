\* The contract for the Go-style refactor (OPTIMIZATION_BACKLOG.md 1.2):
\* Impl = "contract", prompt and batch channels, every safety property.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2, t3}
    NoTask = NoTask
    Kinds = {"prompt", "batch"}
    Capacities = {0, 1}
    BatchCapacity = 2
    MaxBatch = 2
    Ops = 2
    WorkerCounts = {1, 3}
    Impl = "contract"
    Mutation = "none"
    MaxCancels = 1
    MaxSpurious = 1
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoLostWake
    RegisteredWhileWaiting
    ExactlyOnce
    ClaimsHeld
PROPERTIES
    OneStep
    RegistrationServed
CHECK_DEADLOCK FALSE
