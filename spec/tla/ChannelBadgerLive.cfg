\* Liveness of the current implementation, prompt channels: every blocked
\* receive is woken. No symmetry (TLC cannot reduce liveness by symmetry
\* soundly), one operation per task to keep the run under two minutes.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2, t3}
    NoTask = NoTask
    Kinds = {"prompt"}
    Capacities = {0, 1}
    BatchCapacity = 2
    MaxBatch = 2
    Ops = 1
    WorkerCounts = {1, 3}
    Impl = "current"
    Mutation = "none"
    MaxCancels = 1
    MaxSpurious = 1
CHECK_DEADLOCK FALSE
PROPERTIES
    EveryBlockedRecvWoken
