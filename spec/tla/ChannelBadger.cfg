\* The current implementation (crates/badger_runtime/src/channel.rs at ac3f85c),
\* prompt channels: the safety invariants (the regression gate). 3 tasks, 1
\* channel, capacity 0 and 1, one worker and one worker per task, 2
\* operations per task, one cancellation and one wake without a delivery.
\* Batch channels and the stricter properties are checked by the configurations
\* run.sh derives from this one and from ChannelBadgerContract.cfg.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2, t3}
    NoTask = NoTask
    Kinds = {"prompt"}
    Capacities = {0, 1}
    BatchCapacity = 2
    MaxBatch = 2
    Ops = 2
    WorkerCounts = {1, 3}
    Impl = "current"
    Mutation = "none"
    MaxCancels = 1
    MaxSpurious = 1
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoLostWake
    RegisteredWhileWaiting
    AtMostOnce
    CountsMatch
    OneEntryPerKind
    PhasePublished
    ClaimsHeld
CHECK_DEADLOCK FALSE
