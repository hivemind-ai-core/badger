[package]
name = "tooling"
entry = "src/main.lang"

[runtime]
trace_capacity = 4
trace_overflow = "drop_oldest"
cleanup_grace_ms = 2000

[profile.strict.runtime]
trace_capacity = 2
trace_overflow = "drop_newest"

[entries]
admin = "src/admin.lang"

[tasks]
seed = "src/tasks.lang#seed"
greet = "src/tasks.lang#greet"
