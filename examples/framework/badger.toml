[package]
name = "todo"
entry = "src/api.bdg"

[entries]
cli = "src/cli.bdg"
worker = "src/worker.bdg"
migrate = "src/migrate.bdg"

[config]
address = "127.0.0.1"
port = 8080
database = "tasks.db"

# the feature's core knows nothing of its transports or of a particular
# store (the adapters, `tasks.memory` and `tasks.sqlite_store`, may); its
# errors say how a transport reports them (`@http.status`, `@command.exit`),
# so the model may name `std.http` and `std.command`, but binds nothing
[layers.tasks.model]
forbid = ["web", "cli", "api", "tasks.sqlite_store", "std.endpoint", "std.sqlite"]

[layers.tasks.service]
forbid = ["web", "cli", "api", "tasks.sqlite_store", "std.http", "std.endpoint", "std.command", "std.sqlite"]
