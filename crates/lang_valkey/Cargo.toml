[package]
name = "lang_valkey"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Valkey/Redis client native module behind std.valkey (redis-rs on tokio)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lang_native.workspace = true
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false }
