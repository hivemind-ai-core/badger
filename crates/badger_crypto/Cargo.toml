[package]
name = "badger_crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The encoding, hashing, randomness, and UUID native module behind std.encoding, std.crypto, and std.uuid"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
badger_native.workspace = true
base64 = "0.22.1"
sha2 = "0.10.9"
hmac = "0.12.1"
percent-encoding = "2.3.2"
getrandom = "0.3.4"
uuid = { version = "1.27.0", features = ["v4", "v7"] }
