[package]
name = "badger_template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The template native module behind std.template (minijinja)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
badger_native.workspace = true
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "multi_template", "serde", "macros", "adjacent_loop_items"] }
serde_json = "1.0.154"
