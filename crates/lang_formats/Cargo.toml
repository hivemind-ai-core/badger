[package]
name = "lang_formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The TOML, YAML, and CSV native module behind std.toml, std.yaml, and std.csv"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lang_native.workspace = true
serde_json = "1.0.154"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "display", "serde"] }
serde_yaml_ng = "0.10.0"
csv = "1.4.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
