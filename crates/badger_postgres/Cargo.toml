[package]
name = "badger_postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The PostgreSQL client native module behind stdx.postgres (tokio-postgres)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
badger_native.workspace = true
tokio-postgres = "0.7.18"
deadpool-postgres = "0.14.2"
tokio-postgres-rustls = "0.14.0"
postgres-protocol = "0.6.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
bytes = "1"
serde_json = "1"
fallible-iterator = "0.2"
