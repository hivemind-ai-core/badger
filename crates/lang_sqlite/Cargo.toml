[package]
name = "lang_sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The SQLite native module behind std.sqlite (rusqlite)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lang_native.workspace = true
rusqlite = { version = "0.38", features = ["bundled", "column_decltype", "column_metadata"] }
serde_json = "1.0.154"
