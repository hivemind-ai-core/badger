[package]
name = "badger_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
backtrace = "0.3.76"
corosensei = "0.3"
crossbeam-deque = "0.8.8"
badger_native = { path = "../badger_native" }
libc = "0.2.190"
regex = "1.13.1"
rustc-hash.workspace = true
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }
base64 = "0.22.1"
itoa = "1.0.18"

[features]
# Collector diagnostics and policy experiments, absent from normal builds.
gc-profile = []
# ThreadSanitizer fiber annotations for coroutine stack switches (build with
# -Zsanitizer=thread)
tsan = []
# AddressSanitizer support (build with -Zsanitizer=address)
asan = []
