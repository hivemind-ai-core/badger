[package]
name = "badger_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ahash = { version = "0.8.12", default-features = false }
backtrace = "0.3.76"
corosensei = "0.3"
badger_native = { path = "../badger_native" }
libc = "0.2.190"
regex = "1.13.1"
rustc-hash.workspace = true
serde = "1.0.229"
serde_json = "1.0.154"

[features]
# Collector diagnostics and policy experiments, absent from normal builds.
gc-profile = []
# ThreadSanitizer fiber annotations for coroutine stack switches (build with
# -Zsanitizer=thread)
tsan = []
# AddressSanitizer support (build with -Zsanitizer=address)
asan = []
